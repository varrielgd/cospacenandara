services:
  - type: web
    name: cospacenandara
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm run db:generate && npm run db:push && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: DATABASE_URL
        fromDatabase:
          name: nandara-db
          property: connectionString
      - key: DIRECT_DATABASE_URL
        fromDatabase:
          name: nandara-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash
      - key: SERPAPI_API_KEY
        sync: false
      - key: SCRAPERAPI_API_KEY
        sync: false
      - key: FRONTEND_URL
        value: https://nandaracorporation.vercel.app
      - key: SMTP_HOST
        value: smtp.hostinger.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_USER
        value: marketing@nandaranusamontierra.com
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        value: marketing@nandaranusamontierra.com
      - key: SMTP_SECURE
        value: "true"
      - key: IMAP_HOST
        value: imap.hostinger.com
      - key: IMAP_PORT
        value: "993"
      - key: IMAP_USER
        value: marketing@nandaranusamontierra.com
      - key: IMAP_PASS
        sync: false
      - key: IMAP_SECURE
        value: "true"
      - key: GOOGLE_SHEET_ID
        sync: false
      - key: GOOGLE_SCRIPT_URL
        sync: false

databases:
  - name: nandara-db
    databaseName: nandara_db
    user: nandara_user
    plan: free